[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scam-onset"
version = "0.1.0"
license = {file = "LICENSE"}
description = "Многоязычная (ru/en/zh) детекция скама на уровне диалога с разметкой онсета обмана"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]          # ядро/калибровка: почти stdlib

[project.optional-dependencies]
# слой моделей (стадия 6+); ставить отдельно: pip install -e ".[ml]"
ml = [
  "torch>=2.2", "transformers>=4.44", "datasets>=2.20",
  "sentence-transformers>=3.0", "scikit-learn>=1.4",
  "lightgbm>=4.3", "catboost>=1.2", "xgboost>=2.0",
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.13",
]
# фигуры для статьи (scripts/make_figures.py): pip install -e ".[viz]"
viz = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
scam-iaa = "scam_onset.iaa.harness:_cli"

[tool.ruff]
line-length = 100
